<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Tesla tokens</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page">
    <h1><img src="icons/icon-32.png" alt="" /><span id="title">Your Tesla tokens</span></h1>
    <p id="busy" hidden>Finishing sign-in…</p>
    <div id="ok" hidden>
      <p>Paste both into EVBook's “Connect your Tesla account” screen. Treat them like a password.</p>
      <label for="access">Access token</label>
      <div class="row">
        <textarea id="access" readonly></textarea>
        <button data-copy="access">Copy</button>
      </div>
      <label for="refresh">Refresh token</label>
      <div class="row">
        <textarea id="refresh" readonly></textarea>
        <button data-copy="refresh">Copy</button>
      </div>
    </div>
    <div id="fail" hidden>
      <p class="error" id="message"></p>
      <button id="retry">Try again</button>
    </div>
    <div id="none" hidden>
      <p>Nothing to show. Open the extension and sign in with Tesla.</p>
      <button id="again">Sign in with Tesla</button>
    </div>
    <script src="tokens.js"></script>
  </body>
</html>
