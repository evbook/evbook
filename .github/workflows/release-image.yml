# Publishes the VPS container image for a release tag, so an independent
# installation updates with `docker compose pull` instead of building from
# source. Pushed to GHCR under the repository that runs this, so the release
# repo publishes the canonical image and a hard fork publishes its own.
#
# Runs from the tag push itself — no secrets needed beyond the workflow's own
# GITHUB_TOKEN (packages: write below). Note GHCR packages start private:
# after the first push, make the package public once in its settings so
# anonymous `docker pull` works.
name: release-image

on:
  push:
    tags: ["v*-stable", "v*-canary"]
  # For backfilling an older tag by hand from the Actions page.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.3.4-stable)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # arm64 too: small VPSes and home servers are as likely a home as amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"; VERSION="${VERSION%-*}"
          CHANNEL="${REF##*-}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:$VERSION"
          # `latest` tracks stable; canary rides its own moving tag.
          if [ "$CHANNEL" = "stable" ]; then TAGS="$TAGS,$IMAGE:latest"; else TAGS="$TAGS,$IMAGE:$CHANNEL"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
