# Bun is the project's runtime, package manager, test runner and formatter.
# The Worker itself still runs on workerd; see docs/testing.md for which specs
# run where.

# No `[run] bun = true`: it would force every package bin onto Bun, and wrangler
# does not support the Bun runtime (`wrangler types` fails under it, and says
# so). Bins keep their own shebangs; package.json opts the ones verified on Bun
# (eslint, tsc, vite build, vitest) in with `bun --bun`. wrangler, cf and
# playwright run on Node, which therefore stays installed.

[test]
# `bun test` runs every spec that does not need workerd. The ones that reach D1,
# Durable Objects or R2 through `cloudflare:test` are named `*.workerd.test.ts`
# and run in the vitest workers pool (vitest.config.ts) instead.
pathIgnorePatterns = ["**/*.workerd.test.ts", "e2e/**", "node_modules/**", "dist/**", ".wrangler/**", ".claude/**"]
# The Node runtime's smoke test boots servers and replays imports.
timeout = 30000

[fmt]
# The house line length: the code was already written to it, so this is the
# width that reformats least.
printWidth = 120
# Code only. Prose (Markdown tables), the static site's HTML, and JSON(C) —
# wrangler.jsonc is kept in parity with cloudflare.config.ts by hand — stay as
# written.
ignorePatterns = ["**/*.md", "**/*.html", "**/*.json", "**/*.jsonc", "**/*.css", "**/*.yml", "**/*.yaml", "migrations/**", "worker-configuration.d.ts"]
